name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build deps
        run: npm ci

      # build.js가 index.html/images는 그대로, js/**/*.js는 주석 제거+압축(esbuild)해서 dist에 낸다
      # (2026-08-30) — 내부 코멘트(버그 리포트 근거, 판단 로직 설명 등)가 실서비스 응답에 그대로
      # 노출되던 문제 대응. 원본 소스는 그대로 두고 여기서 만든 dist만 배포된다.
      - name: Build dist (minify JS, strip comments)
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
